[package]
name = "nushell-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Benchmark, differential tests and an engine bridge, built against nu-parser from nushell's main branch"

# The real Nushell crates, from the `main` branch on GitHub, so that the
# comparison always uses the latest nu-parser. `cargo update` in this
# directory moves to the newest commit; the commit in use is recorded in
# Cargo.lock (and by `tools/scripts/verify.nu --save`).
#
# To build against a local checkout instead, for example the sibling
# `../../../nushell` that the traceability test and `extract-corpus.nu` read,
# uncomment the `[patch]` block at the end of this file.
[dependencies]
nu-winnow-parser = { path = "../.." }
nu-parser = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-protocol = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-engine = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-cmd-lang = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-command = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-cmd-extra = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-std = { git = "https://github.com/nushell/nushell", branch = "main" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bench-vs-nu-parser"
path = "src/bin/bench.rs"

[[bin]]
name = "bridge"
path = "src/bin/bridge.rs"

[[bin]]
name = "nu-parser-check"
path = "src/bin/check.rs"

[[bin]]
name = "differential"
path = "src/bin/differential.rs"

[workspace]

# Uncomment to use a checkout next to this repository instead of GitHub.
# [patch."https://github.com/nushell/nushell"]
